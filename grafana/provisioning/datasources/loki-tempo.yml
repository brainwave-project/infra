apiVersion: 1
datasources:

  # ── Loki (logs) ───────────────────────────────────────────────────────────
  - name:    Loki
    uid:     loki
    type:    loki
    access:  proxy
    url:     http://loki:3100
    editable: true
    jsonData:
      maxLines:          1000
      derivedFields:
        # Link trace IDs in logs → Tempo
        - name:          TraceID
          matcherRegex:  '"traceId":"(\w+)"'
          url:           '$${__value.raw}'
          datasourceUid: tempo

  # ── Tempo (traces) ────────────────────────────────────────────────────────
  - name:    Tempo
    uid:     tempo
    type:    tempo
    access:  proxy
    url:     http://tempo:3200
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID:  false
        customQuery:     false
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
