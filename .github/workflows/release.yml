name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues:   write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 already pulls the full history INCLUDING all tags,
          # so there's no need (and no auth) for an extra `git fetch --tags`
          # step after persist-credentials: false strips the token.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release@24 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/github@10

      - name: Run semantic release
        env:
          # @semantic-release/github reads GITHUB_TOKEN; @semantic-release/git
          # reads GH_TOKEN to build the `https://x-access-token:${TOKEN}@…` push
          # URL when persist-credentials is false. Export both to be safe.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
