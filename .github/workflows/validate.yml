# =============================================================================
# Validates infrastructure on every PR targeting main. The actual job
# definitions live in _validate.yml so release.yml can re-use them as a gate
# before semantic-release runs.
# =============================================================================

name: Validate Infrastructure

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_validate.yml
