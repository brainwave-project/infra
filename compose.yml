# =============================================================================
# DEPRECATED — use docker/compose.yml + docker/compose.dev.yml instead
# See README.md Quick Start or run: make dev
# =============================================================================
# Brainwave — Local Development Infrastructure Stack
# =============================================================================
# Starts: PostgreSQL, MongoDB, MinIO, Keycloak, Kong
# Application services (auth-hub, user-hub, know-hub) run separately via
# their own `npm run dev` or are included via compose.services.yml.
#
# Usage:
#   docker compose up -d                   # Start infra only
#   docker compose --profile services up   # Start infra + all app services
#   docker compose logs -f kong            # Tail a specific service
#   docker compose down -v                 # Stop + wipe volumes (clean slate)
# =============================================================================

name: brainwave

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — System of record for user_management and doc schemas
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: brainwave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brainwave

  # ---------------------------------------------------------------------------
  # MongoDB — Dynamic document payload store for KnowHub
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: brainwave-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE:      ${MONGO_DB}
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - brainwave

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (hot docs + cold docs + logs)
  # Console: http://localhost:9001  (user: MINIO_ROOT_USER / MINIO_ROOT_PASSWORD)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: brainwave-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brainwave

  # ---------------------------------------------------------------------------
  # MinIO Init — Creates buckets after MinIO is healthy (one-shot)
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: brainwave-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh /init.sh
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_HOST:          minio
    volumes:
      - ./minio/init.sh:/init.sh:ro
    networks:
      - brainwave
    restart: "no"

  # ---------------------------------------------------------------------------
  # Keycloak — Identity Provider (start-dev + realm import)
  # Admin console: http://localhost:8080/admin  (KEYCLOAK_ADMIN_USER / PASSWORD)
  # Token endpoint: http://localhost:8080/realms/brainwave/protocol/openid-connect/token
  # JWKS:           http://localhost:8080/realms/brainwave/protocol/openid-connect/certs
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: brainwave-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB:           dev-mem     # In-memory for local dev. Switch to "postgres" for prod.
      KC_HOSTNAME:     localhost
      KC_HTTP_PORT:    8080
      KC_LOG_LEVEL:    info
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks:
      - brainwave

  # ---------------------------------------------------------------------------
  # Kong — API Gateway (DB-less declarative mode)
  # Proxy:        http://localhost:8000   ← All client traffic goes here
  # Admin API:    http://localhost:8001   ← Local only, never expose in prod
  # ---------------------------------------------------------------------------
  kong:
    image: kong:3.7
    container_name: brainwave-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE:            "off"
      KONG_DECLARATIVE_CONFIG:  /kong/declarative/kong.yml
      KONG_PROXY_LISTEN:        0.0.0.0:8000
      KONG_ADMIN_LISTEN:        0.0.0.0:8001
      KONG_LOG_LEVEL:           info
      KONG_PLUGINS:             bundled
      KONG_NGINX_PROXY_READ_TIMEOUT:  60s
      KONG_NGINX_PROXY_SEND_TIMEOUT:  60s
    volumes:
      - ./kong:/kong/declarative:ro
    ports:
      - "8000:8000"  # Public proxy — clients talk here
      - "8001:8001"  # Admin API  — local debug only
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - brainwave

  # ---------------------------------------------------------------------------
  # Application Services (opt-in via --profile services)
  # Run the microservices alongside infra for an integrated local dev stack.
  # Requires each repo to be cloned as a sibling: ../auth-hub, ../user-hub, etc.
  # ---------------------------------------------------------------------------

  auth-hub:
    profiles: [services]
    build:
      context: ../auth-hub
      dockerfile: Dockerfile
    container_name: brainwave-auth-hub
    restart: unless-stopped
    command: >
      node --loader ts-node/esm src/index.ts
    environment:
      PORT:                      ${AUTH_HUB_PORT:-3000}
      GRPC_PORT:                 ${AUTH_HUB_GRPC_PORT:-50051}
      NODE_ENV:                  development
      SERVICE_NAME:              auth-hub
      DB_HOST:                   postgres
      DB_USER:                   ${POSTGRES_USER}
      DB_PASS:                   ${POSTGRES_PASSWORD}
      KEYCLOAK_BASE_URL:         http://keycloak:8080
      KEYCLOAK_REALM:            brainwave
      KEYCLOAK_CLIENT_ID:        auth-hub-service
      KEYCLOAK_CLIENT_SECRET:    ${KEYCLOAK_AUTH_HUB_SECRET}
      KEYCLOAK_REDIRECT_BASE_URL: http://localhost:8000
    ports:
      - "${AUTH_HUB_PORT:-3000}:3000"
      - "${AUTH_HUB_GRPC_PORT:-50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - ../auth-hub:/app
      - /app/node_modules
    networks:
      - brainwave

  user-hub:
    profiles: [services]
    build:
      context: ../user-hub
      dockerfile: Dockerfile
    container_name: brainwave-user-hub
    restart: unless-stopped
    environment:
      PORT:         ${USER_HUB_PORT:-3001}
      NODE_ENV:     development
      SERVICE_NAME: user-hub
      DB_HOST:      postgres
      DB_USER:      ${POSTGRES_USER}
      DB_PASS:      ${POSTGRES_PASSWORD}
      AUTH_HUB_GRPC_HOST: auth-hub:50051
    ports:
      - "${USER_HUB_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      auth-hub:
        condition: service_started
    networks:
      - brainwave

  know-hub:
    profiles: [services]
    build:
      context: ../know-hub
      dockerfile: Dockerfile
    container_name: brainwave-know-hub
    restart: unless-stopped
    environment:
      PORT:         ${KNOW_HUB_PORT:-3002}
      NODE_ENV:     development
      SERVICE_NAME: know-hub
      DB_HOST:      postgres
      DB_USER:      ${POSTGRES_USER}
      DB_PASS:      ${POSTGRES_PASSWORD}
      MONGO_URI:    mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      MINIO_HOST:   minio
      MINIO_PORT:   9000
      MINIO_USER:   ${MINIO_ROOT_USER}
      MINIO_PASS:   ${MINIO_ROOT_PASSWORD}
    ports:
      - "${KNOW_HUB_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - brainwave

# =============================================================================
# Named volumes — persisted across container restarts
# =============================================================================
volumes:
  postgres-data:
    name: brainwave-postgres-data
  mongodb-data:
    name: brainwave-mongodb-data
  minio-data:
    name: brainwave-minio-data

# =============================================================================
# Networks
# =============================================================================
networks:
  brainwave:
    name: brainwave
    driver: bridge
