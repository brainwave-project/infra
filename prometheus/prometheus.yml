# =============================================================================
# Prometheus scrape config — Brainwave platform
# =============================================================================
global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: brainwave-dev
    env:     development

# Alert rules
rule_files:
  - /etc/prometheus/rules/services.yml
  - /etc/prometheus/rules/slo.yml

# Alertmanager target
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Prometheus remote-write receiver — accepts metrics pushed by Tempo's
# metrics generator (span-metrics + service-graphs RED data)
# Enabled via --web.enable-remote-write-receiver CLI flag in compose.

scrape_configs:

  # ── Self ────────────────────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── Application services ─────────────────────────────────────────────────
  - job_name: auth-hub
    metrics_path: /metrics
    static_configs:
      - targets: ['auth-hub:3000']
        labels:
          service: auth-hub

  - job_name: user-hub
    metrics_path: /metrics
    static_configs:
      - targets: ['user-hub:3001']
        labels:
          service: user-hub

  - job_name: know-hub
    metrics_path: /metrics
    static_configs:
      - targets: ['know-hub:3002']
        labels:
          service: know-hub

  # ── API Gateway ──────────────────────────────────────────────────────────
  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ['kong:8001']
        labels:
          service: kong

  # ── OTel Collector (own internal metrics) ────────────────────────────────
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: otel-collector

  # ── OTel Collector (metrics pipeline export) ─────────────────────────────
  # Application OTLP metrics forwarded by the collector
  - job_name: otel-app-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ['otel-collector:8889']

  # ── Host / OS metrics ────────────────────────────────────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: node-exporter

  # ── Container metrics ────────────────────────────────────────────────────
  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: cadvisor

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres

  # ── MongoDB ──────────────────────────────────────────────────────────────
  - job_name: mongodb
    static_configs:
      - targets: ['mongodb-exporter:9216']
        labels:
          service: mongodb
