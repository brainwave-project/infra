# =============================================================================
# Promtail — container log shipper
# =============================================================================
# Discovers all Docker containers via the Docker socket (Docker SD).
# Labels each log line with: container, service, project, stream.
# JSON pipeline stage extracts level/msg fields when logs are structured JSON.
# Ships everything to Loki at port 3100.
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait:  1s
    batchsize:  1048576   # 1 MB

scrape_configs:

  # ── Docker socket discovery ──────────────────────────────────────────────
  - job_name: containers
    docker_sd_configs:
      - host:             unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name:   label
            values: ["com.docker.compose.project=brainwave"]

    relabel_configs:
      # Strip leading slash from container name
      - source_labels: [__meta_docker_container_name]
        regex:        '/(.*)'
        target_label: container

      # Docker Compose service label → service label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

      # stdout vs stderr
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

    pipeline_stages:
      # Try to parse structured JSON logs (pino format)
      - json:
          expressions:
            level:         level
            msg:           msg
            service_name:  service
            correlation_id: correlationId

      # Promote extracted fields to labels (low-cardinality only)
      - labels:
          level:
          service_name:

      # Drop noisy health-check probe logs
      - drop:
          expression: '.*GET /health.*'
          drop_counter_reason: health_probe
