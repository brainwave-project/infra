# =============================================================================
# Dev overrides â€" applied on top of compose.yml
# =============================================================================
# Keycloak: start-dev + in-memory DB (fastest startup, no persistence)
# All service ports exposed on 0.0.0.0 (localhost access)
# Kong Admin API exposed for local debugging
# App services: source-mounted for hot reload, ts-node for TypeScript
#
# Usage:
#   make dev
#   docker compose -f docker/compose.yml -f docker/compose.dev.yml \
#     --env-file env/.env.dev up -d
#
#   With app services:
#   docker compose -f docker/compose.yml -f docker/compose.dev.yml \
#     --env-file env/.env.dev --profile services up -d
# =============================================================================

services:

  postgres:
    restart: on-failure:3
    ports:
      - "6632:5432"

  mongodb:
    restart: on-failure:3
    ports:
      - "27017:27017"

  minio:
    restart: on-failure:3
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console â†’ http://localhost:9001

  keycloak:
    restart: on-failure:3
    # dev-file: H2 written to the container's own filesystem (no volume mount needed).
    # Avoids the root-owned volume permission error. Data is ephemeral like dev-mem
    # but migrations initialise reliably before the realm import runs.
    command: start-dev --import-realm
    environment:
      KC_DB:        dev-file
      KC_HOSTNAME:  localhost
      KC_HTTP_PORT: "8080"
      KC_LOG_LEVEL: info
    ports:
      - "8080:8080"   # Admin: http://localhost:8080/admin

  kafka:
    restart: on-failure:3
    ports:
      - "29092:29092"   # External listener — host access (kafkajs, kafka-cli, etc.)

  kong:
    restart: on-failure:3
    environment:
      # Admin API on 8001 + Kong Manager GUI on 8002 (OSS, free since 3.4).
      # Kong Manager uses its own listener — NOT gui=on inside KONG_ADMIN_LISTEN.
      KONG_ADMIN_LISTEN:      0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN:  0.0.0.0:8002
      KONG_ADMIN_GUI_URL:     http://localhost:8002
      KONG_LOG_LEVEL:       info
      KONG_DNS_TTL:         10             # Re-resolve service hostnames every 10s
      KONG_DNS_STALE_TTL:   5             # Use stale entry for max 5s while re-resolving
    ports:
      - "8000:8000"   # Proxy       — all client traffic
      - "8001:8001"   # Admin API   — local debug only, NEVER expose in prod
      - "8002:8002"   # Kong Manager GUI — local debug only, NEVER expose in prod

  # ---------------------------------------------------------------------------
  # Application services (opt-in: --profile services)
  # Mounts the full monorepo root at /workspace so that file:../core resolves.
  # Uses node:20-alpine directly â€" no Dockerfile build step needed for dev.
  # Named volumes per service keep node_modules isolated from the host.
  # ---------------------------------------------------------------------------

  auth-hub:
    profiles: [services]
    image: node:20-alpine
    container_name: brainwave-auth-hub
    working_dir: /workspace/auth-hub
    restart: on-failure:3
    command: sh -c "npm install && npx tsx --import @opentelemetry/auto-instrumentations-node/register src/index.ts"
    # Literal config (NODE_ENV, KEYCLOAK_*) is in env/services/auth-hub.dev.env.
    # environment: below only carries values that need ${...} interpolation.
    env_file:
      - ../env/services/auth-hub.dev.env
    environment:
      PORT:                    ${AUTH_HUB_PORT:-3000}
      GRPC_PORT:               ${AUTH_HUB_GRPC_PORT:-50051}
      DB_USER:                 ${POSTGRES_USER}
      DB_PASS:                 ${POSTGRES_PASSWORD}
      KEYCLOAK_CLIENT_SECRET:  ${KEYCLOAK_AUTH_HUB_SECRET}
      KEYCLOAK_ADMIN_USER:     ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_pass}
      KAFKA_BROKERS:           ${KAFKA_BROKERS:-kafka:9092}
    ports:
      - "${AUTH_HUB_PORT:-3000}:3000"
      - "${AUTH_HUB_GRPC_PORT:-50051}:50051"
    volumes:
      - ../../:/workspace
      - auth-hub-node-modules:/workspace/auth-hub/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - brainwave

  user-hub:
    profiles: [services]
    image: node:20-alpine
    container_name: brainwave-user-hub
    working_dir: /workspace/user-hub
    restart: on-failure:3
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma generate && npx prisma db seed && npx tsx --import @opentelemetry/auto-instrumentations-node/register src/index.ts"
    env_file:
      - ../env/services/user-hub.dev.env
    environment:
      PORT:                    ${USER_HUB_PORT:-3001}
      DATABASE_URL:            "postgresql://${POSTGRES_USER:-brainwave}:${POSTGRES_PASSWORD:-brainwave_dev_pass}@postgres:5432/${POSTGRES_DB:-brainwave}"
      KEYCLOAK_ADMIN_USER:     ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_pass}
      KAFKA_BROKERS:           ${KAFKA_BROKERS:-kafka:9092}
    ports:
      - "${USER_HUB_PORT:-3001}:3001"
    volumes:
      - ../../:/workspace
      - user-hub-node-modules:/workspace/user-hub/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      auth-hub:
        condition: service_started
    networks:
      - brainwave

  know-hub:
    profiles: [services]
    image: node:20-alpine
    container_name: brainwave-know-hub
    working_dir: /workspace/know-hub
    restart: on-failure:3
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma generate && npx tsx --import @opentelemetry/auto-instrumentations-node/register src/index.ts"
    env_file:
      - ../env/services/know-hub.dev.env
    environment:
      PORT:             ${KNOW_HUB_PORT:-3002}
      DATABASE_URL:     "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      MONGO_URI:        "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      KAFKA_BROKERS:    ${KAFKA_BROKERS:-kafka:9092}
    ports:
      - "${KNOW_HUB_PORT:-3002}:3002"
    volumes:
      - ../../:/workspace
      - know-hub-node-modules:/workspace/know-hub/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - brainwave

  audit-hub:
    profiles: [services]
    image: node:20-alpine
    container_name: brainwave-audit-hub
    working_dir: /workspace/audit-hub
    restart: on-failure:3
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma generate && npx tsx --import @opentelemetry/auto-instrumentations-node/register src/index.ts"
    env_file:
      - ../env/services/audit-hub.dev.env
    environment:
      PORT:          ${AUDIT_HUB_PORT:-3003}
      DATABASE_URL:  "postgresql://audithub_app:${AUDITHUB_DB_PASS}@postgres:5432/${POSTGRES_DB}?schema=audit"
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
    ports:
      - "${AUDIT_HUB_PORT:-3003}:3003"
    volumes:
      - ../../:/workspace
      - audit-hub-node-modules:/workspace/audit-hub/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - brainwave

volumes:
  auth-hub-node-modules:
    name: brainwave-auth-hub-node-modules
  user-hub-node-modules:
    name: brainwave-user-hub-node-modules
  know-hub-node-modules:
    name: brainwave-know-hub-node-modules
  audit-hub-node-modules:
    name: brainwave-audit-hub-node-modules

