# =============================================================================
# Brainwave — Base Compose (shared across all environments)
# =============================================================================
# DO NOT run this file directly. Always pair it with an environment override:
#
#   make dev              # or:
#   docker compose -f docker/compose.yml -f docker/compose.dev.yml \
#     --env-file env/.env.dev up -d
#
# All relative paths here resolve from the docker/ directory:
#   ../postgres/init  →  infra/postgres/init
#   ../keycloak       →  infra/keycloak
#   ../../auth-hub    →  ~/brainwave/auth-hub
# =============================================================================

name: brainwave

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — System of record (user_management + doc + sem schemas)
  # pgvector/pgvector:pg16 = stock postgres:16 + the `vector` extension.
  # Binary on-disk format is identical to postgres:16 — swapping the image on an
  # existing brainwave-postgres-data volume is a safe, in-place upgrade.
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brainwave-postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brainwave

  # ---------------------------------------------------------------------------
  # MongoDB — Dynamic document payload store for KnowHub
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: brainwave-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE:      ${MONGO_DB}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - brainwave

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: brainwave-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brainwave

  # ---------------------------------------------------------------------------
  # MinIO Init — Creates buckets + lifecycle policies (one-shot on first run)
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: brainwave-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh /init.sh
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_HOST:          minio
    volumes:
      - ../minio/init.sh:/init.sh:ro
    networks:
      - brainwave
    restart: "no"

  # ---------------------------------------------------------------------------
  # Keycloak — Identity Provider
  # command, KC_DB, KC_HOSTNAME, and ports are all set in environment overrides
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: brainwave-keycloak
    environment:
      KEYCLOAK_ADMIN:          ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data/h2
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8080' 2>/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 30s
    networks:
      - brainwave

  # ---------------------------------------------------------------------------
  # Kafka — Event streaming backbone (KRaft mode, no ZooKeeper)
  # Topics are created by kafka-init on first boot.
  # Internal listener:  kafka:9092  (service-to-service)
  # External listener:  localhost:29092  (host access, e.g. kafka-ui or CLI tools)
  # Controller listener: kafka:9093 (KRaft internal)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: brainwave-kafka
    environment:
      # KRaft — no ZooKeeper
      KAFKA_NODE_ID:                        1
      KAFKA_PROCESS_ROLES:                  broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@kafka:9093

      # Listeners
      KAFKA_LISTENERS:                      PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME:     PLAINTEXT

      # Sensible defaults for a single-broker dev cluster
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:      "false"   # Topics created explicitly by kafka-init
      KAFKA_LOG_RETENTION_HOURS:            168       # 7 days
      KAFKA_LOG_SEGMENT_BYTES:              104857600 # 100 MB segments
      KAFKA_NUM_PARTITIONS:                 3
      KAFKA_DEFAULT_REPLICATION_FACTOR:     1         # Single broker in dev
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:  1
      CLUSTER_ID:                           MkU3OEVBNTcwNTJENDM2Qk5T   # Fixed dev cluster ID
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - brainwave

  # ---------------------------------------------------------------------------
  # Kafka Init — Creates all platform topics (one-shot)
  # Standard topic naming: brainwave.<domain>.events
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:latest
    container_name: brainwave-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    volumes:
      - ../kafka/init-topics.sh:/init-topics.sh:ro
    networks:
      - brainwave
    restart: "no"

  # ---------------------------------------------------------------------------
  # Ollama — Local embedding model runtime (Semantic Layer, Phase 1)
  # Serves nomic-embed-text (768-dim) on :11434 over the brainwave network.
  # All embedding inference is local — document text never leaves the network.
  #
  # The model is NOT bundled in the image. It is pulled once into the
  # ollama-data volume by the one-shot ollama-init service below, then survives
  # restarts. know-hub reaches this at http://ollama:11434 (internal DNS).
  # Port is exposed for local debugging in compose.dev.yml only.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: brainwave-ollama
    volumes:
      - ollama-data:/root/.ollama   # model weights persist across restarts
    healthcheck:
      # `ollama list` returns non-zero until the daemon's API is accepting calls.
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - brainwave

  # ---------------------------------------------------------------------------
  # Ollama Init — Pulls nomic-embed-text on first boot (one-shot, idempotent)
  # Replaces the manual `docker exec ... ollama pull` first-run step.
  # `ollama pull` is a no-op if the model already exists in the volume, so this
  # is safe to re-run on every `up`. Uses the same image (ollama CLI built in).
  # ---------------------------------------------------------------------------
  ollama-init:
    image: ollama/ollama:latest
    container_name: brainwave-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_MODEL:-nomic-embed-text}"]
    networks:
      - brainwave
    restart: "no"

  # ---------------------------------------------------------------------------
  # Kong — DB-less API Gateway
  # Admin listen and log level are set in environment overrides
  # ---------------------------------------------------------------------------
  kong:
    image: kong:3.7
    container_name: brainwave-kong
    environment:
      KONG_DATABASE:           "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN:       0.0.0.0:8000
      KONG_PLUGINS:            bundled
    volumes:
      - ../kong:/kong/declarative:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - brainwave

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
    name: brainwave-postgres-data
  mongodb-data:
    name: brainwave-mongodb-data
  minio-data:
    name: brainwave-minio-data
  keycloak-data:
    name: brainwave-keycloak-data
  kafka-data:
    name: brainwave-kafka-data
  ollama-data:
    name: brainwave-ollama-data

# =============================================================================
# Networks
# =============================================================================
networks:
  brainwave:
    name: brainwave
    driver: bridge
