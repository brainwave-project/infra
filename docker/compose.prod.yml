# =============================================================================
# Production overrides â€” applied on top of compose.yml
# =============================================================================
# Pulls pre-built service images from GitHub Container Registry (ghcr.io)
# instead of building from source. No volume mounts or hot-reload.
#
# Usage:
#   docker compose -f docker/compose.yml -f docker/compose.prod.yml \
#     --env-file env/.env.prod up -d --profile services
#
# Environment (.env.prod should contain):
#   - GITHUB_TOKEN (for ghcr.io authentication if images are private)
#   - All service configuration (DATABASE_URL, MONGO_URI, MINIO_*, etc.)
# =============================================================================

services:

  postgres:
    restart: on-failure:3
    ports:
      - "5432:5432"

  mongodb:
    restart: on-failure:3
    ports:
      - "27017:27017"

  minio:
    restart: on-failure:3
    ports:
      - "9000:9000"
      - "9001:9001"

  keycloak:
    restart: on-failure:3
    command: start-dev --import-realm
    environment:
      KC_DB:        dev-file
      KC_HOSTNAME:  localhost
      KC_HTTP_PORT: "8080"
      KC_LOG_LEVEL: info
    ports:
      - "8080:8080"

  kong:
    restart: on-failure:3
    ports:
      - "8000:8000"
      - "8001:8001"

  # ---------------------------------------------------------------------------
  # Application services â€” pull pre-built images from ghcr.io
  # No volumes, no hot-reload. Database migrations run on startup via init.sql.
  # ---------------------------------------------------------------------------

  auth-hub:
    profiles: [services]
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER}/brainwave-auth-hub:${GHCR_TAG:-latest}
    container_name: brainwave-auth-hub
    restart: on-failure:3
    # Literal config (NODE_ENV, KEYCLOAK_*) is in env/services/auth-hub.prod.env.
    # environment: below only carries values that need ${...} interpolation.
    env_file:
      - ../env/services/auth-hub.prod.env
    environment:
      PORT:                       ${AUTH_HUB_PORT:-3000}
      GRPC_PORT:                  ${AUTH_HUB_GRPC_PORT:-50051}
      DB_USER:                    ${POSTGRES_USER}
      DB_PASS:                    ${POSTGRES_PASSWORD}
      KEYCLOAK_CLIENT_SECRET:     ${KEYCLOAK_AUTH_HUB_SECRET}
      KEYCLOAK_REDIRECT_BASE_URL: ${AUTH_HUB_REDIRECT_URL:-http://localhost:8000}
    ports:
      - "${AUTH_HUB_PORT:-3000}:3000"
      - "${AUTH_HUB_GRPC_PORT:-50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - brainwave
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  user-hub:
    profiles: [services]
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER}/brainwave-user-hub:${GHCR_TAG:-latest}
    container_name: brainwave-user-hub
    restart: on-failure:3
    env_file:
      - ../env/services/user-hub.prod.env
    environment:
      PORT:                    ${USER_HUB_PORT:-3001}
      DATABASE_URL:            "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      KEYCLOAK_ADMIN_USER:     ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${USER_HUB_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      auth-hub:
        condition: service_started
    networks:
      - brainwave
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  know-hub:
    profiles: [services]
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER}/brainwave-know-hub:${GHCR_TAG:-latest}
    container_name: brainwave-know-hub
    restart: on-failure:3
    env_file:
      - ../env/services/know-hub.prod.env
    environment:
      PORT:             ${KNOW_HUB_PORT:-3002}
      DATABASE_URL:     "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      MONGO_URI:        "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      KAFKA_BROKERS:    ${KAFKA_BROKERS:-kafka:9092}
    ports:
      - "${KNOW_HUB_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - brainwave
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  audit-hub:
    profiles: [services]
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER}/brainwave-audit-hub:${GHCR_TAG:-latest}
    container_name: brainwave-audit-hub
    restart: on-failure:3
    env_file:
      - ../env/services/audit-hub.prod.env
    environment:
      PORT:          ${AUDIT_HUB_PORT:-3003}
      DATABASE_URL:  "postgresql://audithub_app:${AUDITHUB_DB_PASS}@postgres:5432/${POSTGRES_DB}?schema=audit"
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
    ports:
      - "${AUDIT_HUB_PORT:-3003}:3003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - brainwave
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

