# =============================================================================
# Production overrides — applied on top of compose.yml
# =============================================================================
# Pulls pre-built service images from GitHub Container Registry (ghcr.io)
# instead of building from source. No volume mounts or hot-reload.
#
# Usage:
#   docker compose -f docker/compose.yml -f docker/compose.prod.yml \
#     --env-file env/.env.prod up -d --profile services
#
# Environment (.env.prod should contain):
#   - GITHUB_TOKEN (for ghcr.io authentication if images are private)
#   - All service configuration (DATABASE_URL, MONGO_URI, MINIO_*, etc.)
# =============================================================================

services:

  postgres:
    restart: always
    ports:
      - "5432:5432"

  mongodb:
    restart: always
    ports:
      - "27017:27017"

  minio:
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"

  keycloak:
    restart: always
    ports:
      - "8080:8080"

  kong:
    restart: always
    ports:
      - "8000:8000"
      - "8001:8001"

  # ---------------------------------------------------------------------------
  # Application services — pull pre-built images from ghcr.io
  # No volumes, no hot-reload. Database migrations run on startup via init.sql.
  # ---------------------------------------------------------------------------

  auth-hub:
    profiles: [services]
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER}/${GHCR_REPO}/brainwave-auth-hub:${GHCR_TAG:-latest}
    container_name: brainwave-auth-hub
    restart: always
    environment:
      PORT:                       ${AUTH_HUB_PORT:-3000}
      GRPC_PORT:                  ${AUTH_HUB_GRPC_PORT:-50051}
      NODE_ENV:                   production
      SERVICE_NAME:               auth-hub
      LOG_LEVEL:                  info
      DB_HOST:                    postgres
      DB_USER:                    ${POSTGRES_USER}
      DB_PASS:                    ${POSTGRES_PASSWORD}
      KEYCLOAK_BASE_URL:          http://keycloak:8080
      KEYCLOAK_REALM:             brainwave
      KEYCLOAK_CLIENT_ID:         auth-hub-service
      KEYCLOAK_CLIENT_SECRET:     ${KEYCLOAK_AUTH_HUB_SECRET}
      KEYCLOAK_REDIRECT_BASE_URL: ${AUTH_HUB_REDIRECT_URL:-http://localhost:8000}
    ports:
      - "${AUTH_HUB_PORT:-3000}:3000"
      - "${AUTH_HUB_GRPC_PORT:-50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - brainwave
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  user-hub:
    profiles: [services]
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER}/${GHCR_REPO}/brainwave-user-hub:${GHCR_TAG:-latest}
    container_name: brainwave-user-hub
    restart: always
    environment:
      PORT:                    ${USER_HUB_PORT:-3001}
      NODE_ENV:                production
      SERVICE_NAME:            user-hub
      LOG_LEVEL:               info
      DATABASE_URL:            "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      AUTH_HUB_GRPC_HOST:      auth-hub
      AUTH_HUB_GRPC_PORT:      "50051"
      KEYCLOAK_BASE_URL:       http://keycloak:8080
      KEYCLOAK_ADMIN_USER:     ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${USER_HUB_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      auth-hub:
        condition: service_started
    networks:
      - brainwave
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  know-hub:
    profiles: [services]
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER}/${GHCR_REPO}/brainwave-know-hub:${GHCR_TAG:-latest}
    container_name: brainwave-know-hub
    restart: always
    environment:
      PORT:             ${KNOW_HUB_PORT:-3002}
      NODE_ENV:         production
      SERVICE_NAME:     know-hub
      LOG_LEVEL:        info
      DATABASE_URL:     "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      MONGO_URI:        "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin"
      MINIO_HOST:       minio
      MINIO_PORT:       "9000"
      MINIO_USE_SSL:    "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${KNOW_HUB_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - brainwave
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
